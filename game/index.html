<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lantern Harbor — Spot the Difference</title>
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<div id="app">
  <header id="hud">
    <div class="hud-left">
      <h1>Lantern Harbor</h1>
      <p class="subtitle">Spot the Difference &middot; <span id="levelName">Level 1 &mdash; Dusk Harbor</span></p>
    </div>
    <div class="hud-mid">
      <div class="counter" id="foundCounter" aria-live="polite">Found 0 / 7</div>
      <div class="dots" id="foundDots" aria-hidden="true"></div>
    </div>
    <div class="hud-right">
      <div class="timer-wrap">
        <div id="timerBar"></div>
        <span id="timerText">3:00</span>
      </div>
      <div class="score">Score <strong id="scoreText">0</strong></div>
      <button id="hintBtn" type="button" title="Hint (H) — reveals one difference, costs 50 points">Hint (H) &middot; 3 left</button>
      <button id="soundBtn" type="button" title="Sound on/off (M)">Sound: On</button>
    </div>
  </header>
  <main id="stage">
    <div class="panel-label left">LEFT &mdash; the original</div>
    <div class="panel-label right">RIGHT &mdash; find 7 changes</div>
    <canvas id="game" width="1240" height="560" aria-label="Spot the difference: two near-identical harbor scenes side by side. Click a difference on either picture to mark it."></canvas>
    <div id="banner" class="hidden"></div>
  </main>
  <footer id="help">
    <span>Click a difference on either picture to circle it.</span>
    <span>Wrong click: &minus;25 points.</span>
    <span><b>H</b> hint &middot; <b>R</b> restart level &middot; <b>M</b> sound</span>
    <span id="bestLine"></span>
  </footer>
</div>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
